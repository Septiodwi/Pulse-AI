<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title">
<title id="title">Peta modul Pulse AI</title>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#112e45"/><stop offset="1" stop-color="#071622"/></linearGradient>
</defs>
<style>
  text { font-family: Verdana, sans-serif; fill: #e9f9ff; }
  .heading { font-size: 23px; font-weight: bold; }
  .label { font-size: 19px; }
  .dot { fill: #55e4e5; animation: pulse 4s ease-in-out infinite; animation-delay: var(--delay); }
  @keyframes pulse { 0%, 55%, 100% { opacity: .55; } 20% { opacity: 1; filter: drop-shadow(0 0 7px #55e4e5); } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<text x="40" y="50" class="heading">Peta modul Pulse AI</text>
<g transform="translate(40 82)">
<rect width="364" height="242" rx="16" fill="#102e42" stroke="#285469"/>
<text x="24" y="40" class="heading">Akses &amp; administrasi</text>
<circle class="dot" style="--delay: 0.0s" cx="28" cy="77" r="5"/>
<text x="47" y="83" class="label">Login &amp; sesi</text>
<circle class="dot" style="--delay: 0.25s" cx="28" cy="119" r="5"/>
<text x="47" y="125" class="label">Management Account</text>
<circle class="dot" style="--delay: 0.5s" cx="28" cy="161" r="5"/>
<text x="47" y="167" class="label">Management User</text>
<circle class="dot" style="--delay: 0.75s" cx="28" cy="203" r="5"/>
<text x="47" y="209" class="label">Synchronize</text>
</g>
<g transform="translate(418 82)">
<rect width="364" height="242" rx="16" fill="#102e42" stroke="#285469"/>
<text x="24" y="40" class="heading">Monitoring &amp; produksi</text>
<circle class="dot" style="--delay: 1.0s" cx="28" cy="77" r="5"/>
<text x="47" y="83" class="label">Dashboard</text>
<circle class="dot" style="--delay: 1.25s" cx="28" cy="119" r="5"/>
<text x="47" y="125" class="label">Brand Profile</text>
<circle class="dot" style="--delay: 1.5s" cx="28" cy="161" r="5"/>
<text x="47" y="167" class="label">AI Content Intelligence</text>
<circle class="dot" style="--delay: 1.75s" cx="28" cy="203" r="5"/>
<text x="47" y="209" class="label">Content Idea Generator</text>
</g>
<g transform="translate(796 82)">
<rect width="364" height="242" rx="16" fill="#102e42" stroke="#285469"/>
<text x="24" y="40" class="heading">Distribusi</text>
<circle class="dot" style="--delay: 2.0s" cx="28" cy="77" r="5"/>
<text x="47" y="83" class="label">Social Media Account</text>
<circle class="dot" style="--delay: 2.25s" cx="28" cy="119" r="5"/>
<text x="47" y="125" class="label">Content Plan</text>
</g>
</svg>
