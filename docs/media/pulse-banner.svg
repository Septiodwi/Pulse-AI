<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Pulse AI</title>
  <desc id="desc">Dari sinyal sosial ke kalender publikasi. Gelombang teal bergerak melintasi kisi biru gelap.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#102c47"/>
      <stop offset="1" stop-color="#071622"/>
    </linearGradient>
    <linearGradient id="wave">
      <stop stop-color="#287d9b"/>
      <stop offset=".55" stop-color="#58eed4"/>
      <stop offset="1" stop-color="#c5fff0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#7bded6" stroke-opacity=".12"/>
    </pattern>
  </defs>
  <style>
    .signal { animation: signal 5s linear infinite; }
    .beacon { transform-box: fill-box; transform-origin: center; animation: beacon 2.5s ease-out infinite; }
    @keyframes signal { to { stroke-dashoffset: -120; } }
    @keyframes beacon { from { opacity: .85; transform: scale(.7); } to { opacity: 0; transform: scale(2.4); } }
    @media (prefers-reduced-motion: reduce) { .signal, .beacon { animation: none; } }
  </style>
  <rect width="1200" height="380" rx="26" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="378" rx="25" fill="url(#grid)" stroke="#316a7d"/>
  <g fill="none" stroke="url(#wave)">
    <path d="M618 225H717L756 186L790 247L836 122L879 266L920 202L947 225H1137" stroke-width="3" opacity=".55"/>
    <path class="signal" d="M618 225H717L756 186L790 247L836 122L879 266L920 202L947 225H1137" stroke-width="5" stroke-dasharray="30 90" stroke-linecap="round"/>
    <circle class="beacon" cx="836" cy="122" r="12" stroke-width="2"/>
  </g>
  <circle cx="836" cy="122" r="5" fill="#c5fff0"/>
  <text x="73" y="169" fill="#f1ffff" font-family="Georgia, serif" font-size="106" letter-spacing="-6">Pulse AI</text>
  <text x="80" y="225" fill="#a8d9df" font-family="Verdana, sans-serif" font-size="25">Dari sinyal sosial ke kalender publikasi</text>
  <text x="82" y="302" fill="#65e6d4" font-family="monospace" font-size="17" letter-spacing="3">MONITOR  /  CREATE  /  PUBLISH</text>
</svg>
